site_name: httpx-cache
site_description: Zero-config, minimal-dependency response caching and deterministic replay for httpx and httpx2.
site_url: https://obendidi.github.io/httpx-cache/

repo_name: obendidi/httpx-cache
repo_url: https://github.com/obendidi/httpx-cache
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant

nav:
  - Home: index.md
  - User Guide: guide.md
  - Policies & RFC 9111: cache_control.md
  - API Reference: api.md
  - Benchmarks: benchmarks.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - css/custom.css
