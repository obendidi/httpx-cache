name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run mypy httpx_cache

  test-dual:
    name: Test dual (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest --cov=httpx_cache --cov-report=term-missing

  test-isolated:
    name: Test ${{ matrix.backend }}-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            backend: httpx
          - python-version: "3.12"
            backend: httpx
          - python-version: "3.11"
            backend: httpx2
          - python-version: "3.13"
            backend: httpx2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: >
          uv run --isolated --no-dev
          --python ${{ matrix.python-version }}
          --extra ${{ matrix.backend }}
          --with pytest
          --with pytest-asyncio
          pytest -v
