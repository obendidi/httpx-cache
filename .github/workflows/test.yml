name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run mypy httpx_cache

  test-dual:
    name: Test dual (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run coverage run -m pytest && uv run coverage report

  test-isolated:
    name: Test ${{ matrix.backend }}-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            backend: httpx
          - python-version: "3.12"
            backend: httpx
          - python-version: "3.11"
            backend: httpx2
          - python-version: "3.13"
            backend: httpx2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: >
          uv run --isolated --no-dev
          --python ${{ matrix.python-version }}
          --extra ${{ matrix.backend }}
          --with pytest
          --with pytest-asyncio
          pytest -v

  test-redis-live:
    name: Test live Redis (Python 3.12)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12
      - env:
          HTTPX_CACHE_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/cache/test_redis_live.py -v
