[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "httpx-cache"
version = "1.1.0"
description = "Zero-config, minimal-dependency response caching and deterministic replay for httpx and httpx2."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Ouail Bendidi", email = "ouail.bendidi@gmail.com" }]
keywords = ["httpx", "httpx2", "cache", "sqlite", "replay", "testing", "ai-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27,<1"]
httpx2 = ["httpx2>=2.5"]
redis = ["redis>=5"]

[project.entry-points.pytest11]
httpx_cache = "httpx_cache.pytest_plugin"

[project.urls]
Homepage = "https://github.com/obendidi/httpx-cache"
Repository = "https://github.com/obendidi/httpx-cache"
Documentation = "https://obendidi.github.io/httpx-cache/"
Issues = "https://github.com/obendidi/httpx-cache/issues"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2.5; python_version >= '3.11'",
  "redis>=5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["httpx_cache"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["httpx_cache"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["httpx_cache"]

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]
fail_under = 85
